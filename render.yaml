# ──────────────────────────────────────────────────────────────────────────────
# Examora Backend — Render.com deployment (canonical config)
#
# Steps:
#   1. Create a free PostgreSQL + Redis (or Upstash) instance on Render.
#   2. Create a "Blueprint" in the Render dashboard and point it at this file.
#   3. Fill in the `sync: false` values in the dashboard.
# ──────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: examora-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run server:build
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false            # Render PostgreSQL connection string
      - key: REDIS_URL
        sync: false            # optional — Redis for Socket.io scaling
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false            # e.g. https://examora-frontend.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false            # Gmail address for Nodemailer invites
      - key: SMTP_PASS
        sync: false            # Gmail app password
      - key: SMTP_FROM
        sync: false
      - key: GROQ_API_KEY
        sync: false            # optional — free-tier AI question generation
