# ──────────────────────────────────────────────────────────────────────────────
# Examora Backend — Render.com deployment (canonical config)
#
# Steps:
#   1. Create a "Blueprint" in the Render dashboard and point it at this file.
#      The managed PostgreSQL below is provisioned automatically — no manual
#      database setup needed.
#   2. Fill in the `sync: false` values in the dashboard.
#   3. Set BACKEND_URL + NEXT_PUBLIC_SOCKET_URL on the Vercel frontend to the
#      public URL of the deployed examora-backend service (Task P0-1).
# ──────────────────────────────────────────────────────────────────────────────

databases:
  - name: examora-db
    databaseName: examora_db
    user: examora
    region: oregon
    plan: free

services:
  - type: web
    name: examora-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npx prisma migrate deploy && npm run server:build
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: examora-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: examora-db
          property: connectionString
      - key: TRUST_PROXY
        value: 1               # backend runs behind Render's reverse proxy
      - key: REDIS_URL
        sync: false            # optional — Redis for Socket.io scaling
      - key: AI_SERVICE_URL
        sync: false            # optional — FastAPI doc-parsing service URL
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false            # e.g. https://examora-frontend.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false            # Gmail address for Nodemailer invites
      - key: SMTP_PASS
        sync: false            # Gmail app password
      - key: SMTP_FROM
        sync: false
      - key: GROQ_API_KEY
        sync: false            # optional — free-tier AI question generation
