# ──────────────────────────────────────────────────────────────────────────────
# Examora — Production Nginx config (SSL termination via Let's Encrypt)
#
# Prerequisites:
#   - Point your domain's DNS (A record) at this host.
#   - Set DOMAIN_NAME + LETSENCRYPT_EMAIL in docker-compose.prod.yml
#     (or a .env file) before the first run.
#   - First run: start nginx, then run the certbot service:
#       docker compose -f docker-compose.prod.yml up -d nginx
#       docker compose -f docker-compose.prod.yml run --rm certbot
#   - Renewal is handled automatically by the certbot service.
# ──────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting for login brute-force protection at the edge
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    # ── Upstream container definitions ────────────────────────────────────
    upstream frontend_app {
        server frontend:3000;
    }

    upstream backend_app {
        server backend:4000;
    }

    # ── HTTP → HTTPS redirect (except ACME challenges) ────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;   # Replace with your domain, e.g. exam.example.com

        client_max_body_size 20M;

        # Let's Encrypt certificates (generated by the certbot service)
        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_prefer_server_ciphers on;

        # Security headers (CSP is also enforced by Helmet on the backend)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Rate limit auth endpoints at the edge
        location /api/auth/ {
            limit_req zone=login_zone burst=10 nodelay;
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /api/* requests to Express backend
        location /api/ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /socket.io/* WebSocket connections to Express backend
        location /socket.io/ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Route all other requests (/) to Next.js frontend
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
