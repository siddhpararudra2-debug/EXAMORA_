# ──────────────────────────────────────────────────────────────────────────────
# Examora Backend — Render.com deployment (free tier friendly)
#
# Steps:
#   1. Create a free PostgreSQL + Redis (or Upstash) instance on Render.
#   2. In the dashboard, create a new "Web Service" pointing at this repo:
#        Root Directory: (empty — monorepo root)
#        Build Command:  npm ci && npx prisma generate && npm run server:build
#        Start Command:  npm run server:start
#      (or use "Blueprint" and reference this file directly)
#   3. Provide the env vars below (DATABASE_URL, REDIS_URL, JWT_SECRET, ...).
# ──────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: examora-backend
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm ci && npx prisma generate && npm run server:build
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false            # set manually — Render PostgreSQL connection string
      - key: REDIS_URL
        sync: false            # optional — set manually if using Redis for Socket.io
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://examora.onrender.com   # ← replace with your frontend URL
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false            # Gmail address for Nodemailer invites
      - key: SMTP_PASS
        sync: false            # Gmail app password
      - key: SMTP_FROM
        sync: false            # e.g. "Examora" <noreply@example.com>
      - key: GROQ_API_KEY
        sync: false            # optional — enables free-tier AI question generation

  # Optional: deploy the Next.js frontend as a second service
  - type: web
    name: examora-frontend
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://examora-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://examora-backend.onrender.com/api
